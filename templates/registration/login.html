{% extends 'base.html' %}

{% block title %}Авторизация{% endblock %}

{% block content %}
    <h2>Авторизация</h2>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="hidden" name="next" value="{{ next|default:'' }}">
        <button type="submit">Войти</button>
    </form>

    <p>
        Еще не зарегистрированы?
        <a href="{% url 'register' %}">Регистрация</a>
    </p>
{% endblock %}
