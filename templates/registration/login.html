{% extends 'base.html' %}

{% block title %}
    Вход
{% endblock %}

{% block content %}

<style>
    .auth-box {
        max-width: 520px;
        margin: auto;
        background: #121212;
        border-radius: 32px;
        padding: 45px;
        border: 1px solid #222;
    }

    .auth-box h1 {
        font-size: 48px;
        margin-bottom: 30px;
    }

    .form-group {
        margin-bottom: 25px;
    }

    .form-group label {
        display: block;
        margin-bottom: 10px;
        color: #c7c7c7;
    }

    .form-group input {
        width: 100%;
        padding: 18px;
        background: #1b1b1b;
        border: 1px solid #2a2a2a;
        border-radius: 16px;
        color: white;
        font-size: 16px;
    }

    .logreg {
        display: flex;
        align-items: center;
        gap: 12px;
    }
</style>

<div class="auth-box">
    <h1>Вход</h1>

    <form method="post">
        {% csrf_token %}

        <input type="hidden" name="next" value="{{ next }}">

        <div class="form-group">
            <label>Логин</label>
            {{ form.username }}
        </div>

        <div class="form-group">
            <label>Пароль</label>
            {{ form.password }}
        </div>

        <div class="logreg">
            <button class="btn" type="submit">Войти</button>
            <a class="btn1" href="{% url 'users:register' %}">Создать аккаунт</a>
        </div>
    </form>
</div>

{% endblock %}
