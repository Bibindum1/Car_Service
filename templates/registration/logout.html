{% extends 'base.html' %}

{% block title %}
    Выход
{% endblock %}

{% block content %}

<style>

    .logout-wrapper {
        min-height: 80vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .logout-card {
        width: 100%;
        max-width: 550px;

        background: #111;
        border: 1px solid #222;

        border-radius: 32px;

        padding: 50px;

        text-align: center;

        box-shadow:
            0 0 40px rgba(0,0,0,0.5);
    }

    .logout-title {
        font-size: 42px;
        font-weight: 800;

        margin-bottom: 20px;

        color: white;
    }

    .logout-text {
        color: #999;
        font-size: 18px;

        margin-bottom: 40px;

        line-height: 1.6;
    }

    .logout-buttons {
        display: flex;
        gap: 15px;
        justify-content: center;
        flex-wrap: wrap;
    }

    .logout-btn {
        padding: 16px 28px;

        border-radius: 16px;

        font-size: 16px;
        font-weight: 700;

        text-decoration: none;

        transition: 0.25s;
        cursor: pointer;

        border: none;
    }

    .logout-confirm {
        background: #ff3b30;
        color: white;
    }

    .logout-confirm:hover {
        background: #ff2419;
        transform: translateY(-2px);
    }

    .logout-cancel {
        background: #1f1f1f;
        color: white;

        border: 1px solid #333;
    }

    .logout-cancel:hover {
        background: #2a2a2a;
        transform: translateY(-2px);
    }

</style>

<div class="logout-wrapper">

    <div class="logout-card">

        <h1 class="logout-title">
            Выход из аккаунта
        </h1>

        <p class="logout-text">
            Вы действительно хотите выйти из аккаунта?
        </p>

        <div class="logout-buttons">

            <form method="post">
                {% csrf_token %}

                <button type="submit"
                        class="logout-btn logout-confirm">
                    Выйти
                </button>
            </form>

            <a href="{% url 'orders:home' %}"
               class="logout-btn logout-cancel">
                Отмена
            </a>

        </div>

    </div>

</div>

{% endblock %}
