{% extends 'base.html' %}

{% block title %}Регистрация{% endblock %}

{% block content %}
    <h2>Регистрация пользователя</h2>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="hidden" name="next" value="{{ next|default:'' }}">
        <button type="submit">Зарегистрироваться</button>
    </form>

    <p>
        Уже зарегистрированы?
        <a href="{% url 'login' %}">Войти</a>
    </p>
{% endblock %}
