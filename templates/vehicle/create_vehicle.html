{% extends 'base.html' %}

{% block title %}
    Добавить авто
{% endblock %}

{% block content %}

    <style>

        .form-box {
            background: #121212;
            border-radius: 34px;
            padding: 45px;
            border: 1px solid #222;
            max-width: 800px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 18px;

            background: #1b1b1b;
            border: 1px solid #2a2a2a;

            border-radius: 16px;
            color: white;
        }

        .form-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
            padding: 50px 20px;
        }

        .form-box {
            width: 100%;
            max-width: 800px;
            background: #111111;
            border-radius: 28px;
            padding: 45px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
            border: 1px solid #222;
        }

        .section-title {
            font-size: 52px;
            margin-bottom: 10px;
            line-height: 1.1;
            color: #ffffff;
        }

        .section-subtitle {
            color: #aaaaaa;
            margin-bottom: 35px;
            font-size: 16px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            color: white;
            margin-bottom: 10px;
            font-size: 16px;
            font-weight: 600;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 16px 18px;
            background: #1b1b1b;
            border: 1px solid #333;
            border-radius: 16px;
            color: white;
            font-size: 15px;
            transition: 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #ff7a00;
            outline: none;
            box-shadow: 0 0 0 4px rgba(255, 122, 0, 0.15);
        }

        .field-error {
            margin-top: 10px;
            background: rgba(255, 0, 0, 0.12);
            border: 1px solid rgba(255, 0, 0, 0.35);
            color: #ff5b5b;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
        }

        .btn {
            margin-top: 10px;
            padding: 16px 28px;
            background: linear-gradient(135deg, #ff7a00, #ff5100);
            border: none;
            border-radius: 16px;
            color: white;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(255, 122, 0, 0.35);
        }

    </style>

    <div class="form-wrapper">

        <div class="form-box">

            <h1 class="section-title">
                Добавить автомобиль
            </h1>

            <p class="section-subtitle">
                Заполните информацию об автомобиле
            </p>

            <form method="post">

                {% csrf_token %}

                {% for field in form %}

                    <div class="form-group">

                        <label>
                            {{ field.label }}
                        </label>

                        {{ field }}

                        {% if field.errors %}
                            <div class="field-error">
                                {{ field.errors|striptags }}
                            </div>
                        {% endif %}

                    </div>

                {% endfor %}

                <button class="btn" type="submit">
                    Сохранить автомобиль
                </button>

            </form>

        </div>

    </div>

{% endblock %}
