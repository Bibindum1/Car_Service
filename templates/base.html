{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}GarageCore{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #090909;
            color: white;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        .layout {
            display: flex;
        }

        .sidebar {
            width: 290px;
            min-height: 100vh;
            position: fixed;
            left: 0;
            top: 0;

            background: linear-gradient(
                    180deg,
                    #111111 0%,
                    #0c0c0c 100%
            );

            border-right: 1px solid #222;

            padding: 30px;
            z-index: 100;
        }

        .logo {
            font-size: 34px;
            font-weight: 900;
            color: #ff6600;
            margin-bottom: 50px;
            letter-spacing: 1px;
        }

        .sidebar nav {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .sidebar nav a {
            text-decoration: none;
            color: #d5d5d5;

            padding: 18px;
            border-radius: 18px;

            font-weight: 600;

            transition: .3s;

            display: flex;
            align-items: center;
            gap: 14px;

            background: #121212;
            border: 1px solid #1d1d1d;
        }

        .sidebar nav a:hover {
            background: #ff6600;
            color: white;
            transform: translateX(5px);
        }

        .main {
            margin-left: 290px;
            width: 100%;
            padding: 35px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 35px;
        }

        .topbar h2 {
            font-size: 28px;
            font-weight: 800;
        }

        .btn {
            background: #ff6600;
            color: white;

            padding: 15px 24px;
            margin-right: 131px;

            border-radius: 16px;
            text-decoration: none;

            font-weight: 700;

            transition: .3s;
            border: none;
            cursor: pointer;
        }

        .btn1 {
            background: #424242;
            color: white;

            padding: 15px 24px;


            border-radius: 16px;
            text-decoration: none;

            font-weight: 700;

            transition: .3s;
            border: none;
            cursor: pointer;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(255, 102, 0, .3);
        }

        .btn1:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(255, 102, 0, .3);
        }

        .section-title {
            font-size: 48px;
            font-weight: 900;
            margin-bottom: 30px;
        }

        .cards {
            display: grid;
            grid-template-columns:repeat(auto-fit, minmax(320px, 1fr));
            gap: 25px;
        }

        .card {
            background: #121212;

            border: 1px solid #222;

            border-radius: 28px;

            overflow: hidden;

            transition: .35s;
        }

        .card:hover {
            transform: translateY(-8px);
            border-color: #ff6600;
        }

        .card img {
            width: 100%;
            height: 240px;
            object-fit: cover;
        }

        .card-content {
            padding: 25px;
        }

        .card-content h2 {
            margin-bottom: 15px;
        }

        .card-content p {
            color: #b0b0b0;
            line-height: 1.7;
        }

        .price {
            color: #ff6600;
            font-size: 32px;
            font-weight: 900;
            margin-top: 20px;
        }

        @media (max-width: 950px) {

            .sidebar {
                display: none;
            }

            .main {
                margin-left: 0;
            }

        }

    </style>

</head>
<body>

<div class="layout">

    <aside class="sidebar">

        <div class="logo">
            <i class="fa-solid fa-wrench"></i>
            GarageCore
        </div>

        <nav>

            <a href="{% url 'orders:home' %}">
                <i class="fa-solid fa-house"></i>
                Главная
            </a>

            <a href="{% url 'vehicle:vehicle_list' %}">
                <i class="fa-solid fa-car"></i>
                Автомобили
            </a>

            <a href="{% url 'orders:order_list' %}">
                <i class="fa-solid fa-file-lines"></i>
                Заказы
            </a>

            <a href="{% url 'orders:services_list' %}">
                <i class="fa-solid fa-screwdriver-wrench"></i>
                Услуги
            </a>

            <a href="{% url 'orders:reviews' %}">
                <i class="fa-solid fa-star"></i>
                Отзывы
            </a>

            <a href="{% url 'orders:prices' %}">
                <i class="fa-solid fa-money-bill"></i>
                Цены
            </a>

            <a href="{% url 'orders:about_list' %}">
                <i class="fa-solid fa-circle-info"></i>
                О сервисе
            </a>

        </nav>

    </aside>

    <main class="main">

        <div class="topbar">

            <h2>
                Premium Auto Service
            </h2>

            <a href="{% url 'orders:order_create' %}" class="btn">
                Создать заявку
            </a>

        </div>

        {% block content %}
        {% endblock %}

    </main>

</div>

</body>
</html>
