<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Code Garage – автосервис{% endblock %}</title>
  {% load static %}
  {% block extra_css %}
    <style>
      :root {
        --bg: #0b1020;
        --panel: #121a33;
        --panel2: #182343;
        --text: #eef2ff;
        --muted: #b7c0e0;
        --accent: #ff6b2c;
        --accent2: #35d07f;
        --line: rgba(255,255,255,.1);
        --shadow: 0 24px 80px rgba(0,0,0,.35);
      }
      * {
        box-sizing: border-box;
      }
      html, body {
        margin: 0;
        height: 100%;
        font-family: Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
        background:
          radial-gradient(circle at top left, rgba(255,107,44,.18), transparent 30%),
          radial-gradient(circle at top right, rgba(53,208,127,.15), transparent 25%),
          linear-gradient(180deg, #0b1020 0%, #111936 45%, #0b1020 100%);
        color: var(--text);
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      .wrap {
        max-width: 1200px;
        margin: 0 auto;
        padding: 24px;
      }
      .nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
        padding: 18px 22px;
        background: rgba(18,26,51,.75);
        backdrop-filter: blur(12px);
        border: 1px solid var(--line);
        border-radius: 22px;
        box-shadow: var(--shadow);
        position: sticky;
        top: 16px;
        z-index: 10;
      }
      .logo {
        display: flex;
        align-items: center;
        gap: 12px;
        font-weight: 800;
        letter-spacing: .3px;
      }
      .wheel {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        background: conic-gradient(from 0deg, var(--accent), #ffd166, var(--accent2), #4ea1ff, var(--accent));
        position: relative;
        box-shadow: 0 0 0 6px rgba(255,255,255,.05);
      }
      .wheel:before, .wheel:after {
        content: '';
        position: absolute;
        inset: 10px;
        border-radius: 50%;
        border: 3px solid rgba(255,255,255,.75);
      }
      .wheel:after {
        inset: 18px;
        border-width: 2px;
      }
      .menu {
        display: flex;
        gap: 18px;
        flex-wrap: wrap;
        color: var(--muted);
        font-size: 14px;
      }
      .card {
        background: linear-gradient(180deg, rgba(24,35,67,.92), rgba(16,24,48,.95));
        border: 1px solid var(--line);
        border-radius: 28px;
        box-shadow: var(--shadow);
      }
      .section {
        margin-top: 24px;
        padding: 26px;
      }
      .section h2 {
        margin: 0 0 14px;
        font-size: 22px;
      }
      .btn {
        padding: 12px 20px;
        border-radius: 16px;
        font-weight: 700;
        border: 1px solid transparent;
        display: inline-flex;
        align-items: center;
        transition: .2s transform;
      }
      .btn:hover {
        transform: translateY(-2px);
      }
      .btn.primary {
        background: linear-gradient(135deg, var(--accent), #ff8a5b);
        color: #fff;
        box-shadow: 0 8px 20px rgba(255,107,44,.25);
      }
      .btn.secondary {
        background: rgba(255,255,255,.06);
        border-color: var(--line);
        color: var(--text);
      }
      .footer {
        margin: 24px 0 8px;
        color: var(--muted);
        text-align: center;
        font-size: 14px;
      }
      .accent {
        color: #ffd7c7;
      }
    </style>
  {% endblock %}
</head>
<body>
  <div class="wrap">
    <header class="nav">
      <div class="logo">
        <div class="wheel"></div>
        <div>
          <div>Code Garage</div>
          <small style="color:var(--muted);font-weight:500">Автосервис • ремонт и диагностика</small>
        </div>
      </div>
      <nav class="menu">
        <a href="{% url 'shop:home' %}">Главная</a>
        <a href="{% url 'shop:services_list' %}">Услуги</a>
        <a href="{% url 'shop:order_list' %}">Оставить заявку</a>
        <a href="{% url 'shop:about_list' %}">О нас</a>
        <a href="{% url 'shop:prices' %}">Цены</a>
        <a href="{% url 'shop:reviews' %}">Отзывы</a>
      </nav>
    </header>

    <main>
      {% block content %}{% endblock %}
    </main>

    <div class="footer">
      © 2026 Code Garage. Автосервис с ярким современным оформлением.
    </div>
  </div>
  {% block extra_js %}{% endblock %}
</body>
</html>
